<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Отчеты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell printer-page">
      <section class="panel reports-page">
        <div class="section-head">
          <h2>Отчеты</h2>
          <div class="inline-actions">
            <a class="btn top-nav-btn" href="/journal.html">Журнал чеков</a>
            <a class="btn top-nav-btn" href="/inventory.html">Склад</a>
            <a class="btn top-nav-btn" href="/debtors.html">Должники</a>
            <a class="btn top-nav-btn" href="/">Назад в кассу</a>
          </div>
        </div>

        <section class="report-card">
          <div class="section-head">
            <h3>Смена</h3>
            <div id="shiftStateBadge" class="muted"></div>
          </div>
          <div class="shift-controls">
            <input id="shiftCashierInput" type="text" placeholder="Кассир" value="Кассир 1" />
            <button id="openShiftBtn" class="btn">Открыть смену</button>
            <button id="closeShiftBtn" class="btn">Закрыть смену</button>
          </div>
        </section>

        <div class="reports-grid">
          <section class="report-card">
            <div class="section-head">
              <h3>X-Отчет</h3>
              <div class="inline-actions">
                <input id="xDateInput" type="date" />
                <button id="refreshXBtn" class="btn">Обновить</button>
                <button id="printXBtn" class="btn">Печать X</button>
              </div>
            </div>
            <div id="xReportBox" class="report-box"></div>
          </section>

          <section class="report-card">
            <div class="section-head">
              <h3>Z-Отчет</h3>
              <div class="inline-actions">
                <input id="zDateFrom" type="date" />
                <input id="zDateTo" type="date" />
                <button id="refreshZBtn" class="btn">Показать</button>
                <button id="closeZBtn" class="btn primary">Снять Z-Отчет</button>
                <button id="printZBtn" class="btn">Печать Z</button>
              </div>
            </div>
            <div id="zReportBox" class="report-box"></div>
          </section>
        </div>

        <section class="report-card">
          <div class="section-head">
            <h3>Месячный отчет</h3>
            <div class="inline-actions">
              <input id="monthlyMonthInput" type="month" />
              <button id="loadMonthlyBtn" class="btn">Показать</button>
            </div>
          </div>
          <div id="monthlyReportBox" class="report-box"></div>
          <div id="monthlyTopBox" class="report-box"></div>
        </section>

        <section class="report-card">
          <div class="section-head">
            <h3>Настройки принтера</h3>
          </div>
          <div class="field">
            Режим печати
            <select id="printerTransport">
              <option value="tcp">TCP (LAN, 9100)</option>
              <option value="com">COM (USB to COM)</option>
            </select>
          </div>

          <div id="tcpFields" class="transport-block">
            <div class="field">
              IP / Host
              <input id="printerHost" type="text" placeholder="192.168.1.50" />
            </div>
            <div class="field">
              Port
              <input id="printerPort" type="number" min="1" max="65535" />
            </div>
          </div>

          <div id="comFields" class="transport-block">
            <div class="field">
              COM порт
              <input id="printerComPort" type="text" placeholder="COM3" />
            </div>
            <div class="field">
              Baud rate
              <input id="printerComBaud" type="number" min="1200" step="1" value="9600" />
            </div>
          </div>

          <div class="field">
            Символов в строке
            <input id="printerChars" type="number" min="20" max="80" />
          </div>
          <div class="field">
            CodePage (обычно 17 для CP866)
            <input id="printerCodePage" type="number" min="0" max="255" />
          </div>

          <div class="printer-actions">
            <button id="savePrinterBtn" class="btn primary">Сохранить</button>
            <button id="testPrinterBtn" class="btn">Тестовая печать</button>
          </div>

          <p id="printerStatus" class="muted"></p>
        </section>

      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="reports.js"></script>
    <script src="printer.js"></script>
  </body>
</html>
